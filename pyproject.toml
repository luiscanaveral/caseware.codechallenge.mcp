[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "caseware-documents-mcp"
version = "0.1.0"
description = "MCP server for procurement and inventory document knowledge base"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25",
    "pytesseract>=0.3",
    "pillow>=11",
    "sentence-transformers>=3",
    "chromadb>=1.5",
    "pydantic>=2",
    "mcp>=1",
    "ollama>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
caseware-mcp = "caseware_documents_mcp.main:main"
